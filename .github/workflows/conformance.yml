name: conformance

# The manifest-treadmill answer (DESIGN.md §6 / adversarial-review finding
# #20): a capture -> apply -> re-capture round-trip gate run per manifest,
# so drift between a manifest's classification rules and the plugin's real
# behavior fails CI instead of surfacing as silent corruption later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # issue #3285: was `code-half-unit` (12 suites, the code/state-boundary
  # slice only). regress-offline-all is a strict superset -- its own first
  # prerequisite IS code-half-unit -- so this job now also runs the 19
  # other offline (no-docker) suites that existed but had never run in any
  # bundle or CI check before this issue: 7 with a Makefile target nobody
  # had wired into a bundle, 12 with no Makefile target at all. Renamed
  # rather than kept as a second, redundant job (this repo has no GitHub
  # branch-protection required-status-check binding to a job id to
  # preserve -- verified, this repo's tier doesn't support that GitHub
  # feature at all, so "required" here means "the CI workflow runs it,"
  # not a hard merge-block).
  regress-offline-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: full generated offline regress corpus (no docker)
        run: make regress-offline-all

      - name: evidence freshness and generated product claims
        run: make release-gate

  code-half-live-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: live promotion lease, fencing, and frozen-input races
        run: make regress-promotion-lock

  code-half-grind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: clean-room code materialization and state handoff
        run: make grind-code-half

  code-half-ecosystem-grind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: advanced WordPress code ecosystem and recovery
        run: make grind-code-half-ecosystem

  code-half-first-sync-hook-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: failed lifecycle hook and exact first-sync recovery
        run: make grind-code-half-first-sync

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        manifest: [core, woocommerce, acf, yoast, fse, elementor, polylang, contact-form-7, ninja-forms, paid-memberships-pro]
    steps:
      - uses: actions/checkout@v4

      - name: docker/compose versions
        run: |
          docker --version
          docker compose version

      - name: conformance gate (${{ matrix.manifest }})
        run: bash sandbox/conformance/run.sh ${{ matrix.manifest }}
