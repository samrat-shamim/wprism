name: engineering platform

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      gate:
        description: Explicit retained-artifact gate to execute
        required: false
        type: choice
        default: none
        options: [none, frozen-candidate, evidence-child, release-validation]
      candidate_sha:
        description: Exact frozen candidate commit
        required: false
        type: string
      evidence_child_sha:
        description: Exact direct evidence-child commit
        required: false
        type: string
      release_family:
        description: Absolute retained family directory on the qualification runner
        required: false
        type: string
      release_selection:
        description: Absolute independent release-selection file
        required: false
        type: string
      release_pin_record:
        description: Absolute independent selection-pin file
        required: false
        type: string
      release_family_sha256:
        description: Independently verified retained release-family digest
        required: false
        type: string
      approval:
        description: Absolute external qualification approval directory
        required: false
        type: string
      prior_receipt:
        description: Absolute prior-stage aggregate receipt on the qualification runner
        required: false
        type: string
      run_live:
        description: Run externally approved live qualification lanes
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  resolve-shas:
    name: resolve immutable event SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - name: Checkout exact event head with ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-08-14
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: resolve
        name: Validate exact base and head objects
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EVENT_BASE" =~ ^[a-f0-9]{40}$ ]] || [[ "$EVENT_BASE" =~ ^0+$ ]]; then
            EVENT_BASE="$(git rev-parse HEAD^)"
          fi
          [[ "$EVENT_HEAD" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$EVENT_BASE^{commit}"
          git cat-file -e "$EVENT_HEAD^{commit}"
          git merge-base "$EVENT_BASE" "$EVENT_HEAD" >/dev/null
          printf 'base=%s\nhead=%s\n' "$EVENT_BASE" "$EVENT_HEAD" >>"$GITHUB_OUTPUT"

  quality:
    name: quality / PHP 8.2
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: make bootstrap-dev
      - name: Offline policy, syntax, static, schema, boundary and drift checks
        run: php sandbox/catalog/fragments/engineering-platform/command-result.php --id=check --result=artifacts/test-results/ci/check.json -- make check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-check
          path: artifacts/test-results/ci/check.json
          if-no-files-found: error
          retention-days: 7

  unit:
    name: unit / PHP ${{ matrix.php }}
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php sandbox/catalog/fragments/engineering-platform/command-result.php --id=unit-php-${{ matrix.php }} --result=artifacts/test-results/ci/unit-php-${{ matrix.php }}.json -- make test-unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-unit-php-${{ matrix.php }}
          path: artifacts/test-results/ci/unit-php-${{ matrix.php }}.json
          if-no-files-found: error
          retention-days: 7

  offline-shards:
    name: catalog offline shards
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: make test-offline OFFLINE_SHARDS=4
      - run: cp artifacts/test-results/offline/result.json artifacts/test-results/ci/offline-shards.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-offline-shards
          path: artifacts/test-results/ci/offline-shards.json
          if-no-files-found: error
          retention-days: 7

  changed-impact:
    name: resolved-SHA changed impact
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: make bootstrap-dev
      - name: Always materialize selector and result
        env:
          BASE_SHA: ${{ needs.resolve-shas.outputs.base }}
          HEAD_SHA: ${{ needs.resolve-shas.outputs.head }}
        run: make test-changed BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA"
      - run: cp artifacts/test-results/changed/result.json artifacts/test-results/ci/changed-impact.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-changed-impact
          path: artifacts/test-results/ci/changed-impact.json
          if-no-files-found: error
          retention-days: 7

  build-dist:
    name: deterministic dist and loader smoke
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Bind build, dist, loader and smoke completion to one result
        run: php sandbox/catalog/fragments/engineering-platform/command-result.php --id=build-dist --result=artifacts/test-results/ci/build-dist.json -- make ci-build-dist-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-build-dist
          path: artifacts/test-results/ci/build-dist.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact candidate dist for the runtime compatibility matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-dist
          path: artifacts/dist/
          if-no-files-found: error
          retention-days: 7

  loader-runtime:
    name: loader / PHP ${{ matrix.php }}
    needs: [resolve-shas, build-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-dist
          path: artifacts/dist
      - name: Exercise the exact source and dist loader on this runtime
        env:
          CANDIDATE_SHA: ${{ needs.resolve-shas.outputs.head }}
          RUNTIME: ${{ matrix.php }}
        run: |
          set -euo pipefail
          php sandbox/catalog/fragments/engineering-platform/loader-runtime-probe.php probe \
            --expected-version="$RUNTIME" --layout=source --loader=agent/duo.php \
            --result="artifacts/test-results/ci/loader-source-$RUNTIME.json"
          php sandbox/catalog/fragments/engineering-platform/loader-runtime-probe.php probe \
            --expected-version="$RUNTIME" --layout=dist --loader=artifacts/dist/payload/agent/duo-loader.php \
            --result="artifacts/test-results/ci/loader-dist-$RUNTIME.json"
          full=()
          if [[ "$RUNTIME" = 8.2 || "$RUNTIME" = 8.3 ]]; then
            composer install --no-interaction --prefer-dist --no-progress
            php sandbox/catalog/fragments/engineering-platform/loader-check.php \
              --dist=artifacts/dist --result="artifacts/test-results/ci/loader-full-$RUNTIME.json"
            full+=(--full-result="artifacts/test-results/ci/loader-full-$RUNTIME.json")
          fi
          php sandbox/catalog/fragments/engineering-platform/loader-runtime-probe.php aggregate \
            --expected-version="$RUNTIME" \
            --source-result="artifacts/test-results/ci/loader-source-$RUNTIME.json" \
            --dist-result="artifacts/test-results/ci/loader-dist-$RUNTIME.json" \
            "${full[@]}" --result="artifacts/test-results/ci/loader-runtime-$RUNTIME.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-loader-runtime-${{ matrix.php }}
          path: artifacts/test-results/ci/loader-runtime-${{ matrix.php }}.json
          if-no-files-found: error
          retention-days: 7

  loader-verdict:
    name: aggregate loader runtime verdict
    if: always()
    needs: [resolve-shas, loader-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - name: Download every runtime result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: receipt-loader-runtime-*
          path: artifacts/test-results/ci
          merge-multiple: true
      - name: Fail closed over the exact five-runtime matrix
        env:
          CANDIDATE_SHA: ${{ needs.resolve-shas.outputs.head }}
        run: >-
          php sandbox/catalog/fragments/engineering-platform/loader-runtime-probe.php verdict
          --runtime-8.0=artifacts/test-results/ci/loader-runtime-8.0.json
          --runtime-8.1=artifacts/test-results/ci/loader-runtime-8.1.json
          --runtime-8.2=artifacts/test-results/ci/loader-runtime-8.2.json
          --runtime-8.3=artifacts/test-results/ci/loader-runtime-8.3.json
          --runtime-8.4=artifacts/test-results/ci/loader-runtime-8.4.json
          --result=artifacts/test-results/ci/loader-runtime.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-loader-runtime-verdict
          path: artifacts/test-results/ci/loader-runtime.json
          if-no-files-found: warn
          retention-days: 7

  evidence-staleness:
    name: exact evidence staleness
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Owner-exported impact and exact stale-subject check
        env:
          BASE_SHA: ${{ needs.resolve-shas.outputs.base }}
          HEAD_SHA: ${{ needs.resolve-shas.outputs.head }}
        run: |
          make evidence-impact BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA"
          php sandbox/catalog/fragments/engineering-platform/command-result.php --id=evidence-staleness --result=artifacts/test-results/ci/evidence-staleness.json -- make evidence-staleness-check REPORT=artifacts/evidence-impact/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-evidence-staleness
          path: artifacts/test-results/ci/evidence-staleness.json
          if-no-files-found: error
          retention-days: 7

  pr-verdict:
    name: aggregate PR verdict
    if: always()
    needs: [resolve-shas, quality, unit, offline-shards, changed-impact, build-dist, loader-verdict, evidence-staleness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - name: Download every independently materialized dependency
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: receipt-*
          path: artifacts/test-results/ci
          merge-multiple: true
      - name: Fail closed over absent, cancelled, malformed, stale, failed, or infrastructure results
        run: >-
          php sandbox/catalog/fragments/engineering-platform/aggregate.php
          --profile=pr
          --dependency=build-dist:artifacts/test-results/ci/build-dist.json
          --dependency=changed-impact:artifacts/test-results/ci/changed-impact.json
          --dependency=check:artifacts/test-results/ci/check.json
          --dependency=evidence-staleness:artifacts/test-results/ci/evidence-staleness.json
          --dependency=loader-runtime:artifacts/test-results/ci/loader-runtime.json
          --dependency=offline-shards:artifacts/test-results/ci/offline-shards.json
          --dependency=unit-php-8.2:artifacts/test-results/ci/unit-php-8.2.json
          --dependency=unit-php-8.3:artifacts/test-results/ci/unit-php-8.3.json
          --result=artifacts/test-results/ci/pr.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-pr-verdict
          path: artifacts/test-results/ci/pr.json
          if-no-files-found: warn
          retention-days: 7

  network-audit:
    name: network-aware dependency audit
    needs: resolve-shas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: make audit
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-network-audit
          path: artifacts/test-results/audit/result.json
          if-no-files-found: error
          retention-days: 7

  frozen-candidate:
    name: frozen candidate authority gate
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'frozen-candidate'
    environment: qualification
    runs-on: duo-performance-qualification-aarch64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: make bootstrap-dev
      - name: Validate frozen input and retain the prior PR decision
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PRIOR_RECEIPT: ${{ inputs.prior_receipt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          [[ "$PRIOR_RECEIPT" = /* ]] && test -f "$PRIOR_RECEIPT" && test ! -L "$PRIOR_RECEIPT"
          install -d -m 0700 artifacts/test-results/gates
          install -m 0600 "$PRIOR_RECEIPT" artifacts/test-results/gates/pr.json
      - run: make build
      - run: make payload-reproducibility-check
      - env:
          APPROVAL: ${{ inputs.approval }}
        run: make candidate-adoption-check APPROVAL="$APPROVAL"
      - name: Run the paired controlled performance gate
        env:
          DUO_PERF_RESOURCE_CLASS: 2cpu-4096mib
          DUO_PERF_RUNNER_PROFILE: duo-performance-dedicated-linux-aarch64/v1
        run: make perf-budget
      - run: make audit
      - name: Aggregate exact frozen-candidate receipts
        run: >-
          php sandbox/catalog/fragments/engineering-platform/aggregate.php
          --profile=frozen-candidate
          --dependency=audit:artifacts/test-results/audit/result.json
          --dependency=candidate-adoption:artifacts/test-results/candidate-adoption/result.json
          --dependency=payload-reproducibility:artifacts/test-results/payload-reproducibility/result.json
          --dependency=perf-budget:artifacts/test-results/performance/budget.json
          --dependency=pr:artifacts/test-results/gates/pr.json
          --result=artifacts/test-results/gates/frozen-candidate.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-candidate-receipts-${{ inputs.candidate_sha }}
          path: |
            artifacts/dist/
            artifacts/test-results/audit/result.json
            artifacts/test-results/candidate-adoption/result.json
            artifacts/test-results/gates/frozen-candidate.json
            artifacts/test-results/payload-reproducibility/result.json
            artifacts/test-results/performance/budget.json
          if-no-files-found: error
          retention-days: 30

  evidence-child:
    name: evidence-child retained-family gate
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'evidence-child'
    environment: evidence-review
    runs-on: duo-qualification
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.evidence_child_sha }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: make bootstrap-dev
      - name: Refresh main and validate exact lineage inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_CHILD_SHA: ${{ inputs.evidence_child_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVIDENCE_CHILD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_CHILD_SHA"
          git fetch --no-tags origin main
      - name: Verify retained family and deterministic assembly
        env:
          RELEASE_FAMILY: ${{ inputs.release_family }}
          RELEASE_SELECTION: ${{ inputs.release_selection }}
          RELEASE_PIN_RECORD: ${{ inputs.release_pin_record }}
        run: |
          make release-family-check RELEASE_FAMILY="$RELEASE_FAMILY" RELEASE_SELECTION="$RELEASE_SELECTION" RELEASE_PIN_RECORD="$RELEASE_PIN_RECORD"
          make assembly-reproducibility-check RELEASE_FAMILY="$RELEASE_FAMILY" RELEASE_SELECTION="$RELEASE_SELECTION" RELEASE_PIN_RECORD="$RELEASE_PIN_RECORD"
      - name: Verify final-integration exception
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_CHILD_SHA: ${{ inputs.evidence_child_sha }}
          RELEASE_FAMILY: ${{ inputs.release_family }}
          RELEASE_SELECTION: ${{ inputs.release_selection }}
          RELEASE_PIN_RECORD: ${{ inputs.release_pin_record }}
        run: >-
          make final-integration-close-gate
          CANDIDATE_SHA="$CANDIDATE_SHA"
          EVIDENCE_CHILD_SHA="$EVIDENCE_CHILD_SHA"
          RELEASE_FAMILY="$RELEASE_FAMILY"
          RELEASE_SELECTION="$RELEASE_SELECTION"
          RELEASE_PIN_RECORD="$RELEASE_PIN_RECORD"
      - run: php sandbox/catalog/fragments/engineering-platform/command-result.php --id=generated-agreement --result=artifacts/test-results/generated-agreement/result.json -- make verify-generated
      - run: php sandbox/catalog/fragments/engineering-platform/command-result.php --id=release-gate --result=artifacts/test-results/release-gate/result.json -- make release-gate
      - name: Aggregate evidence-child receipts
        run: >-
          php sandbox/catalog/fragments/engineering-platform/aggregate.php
          --profile=evidence-child
          --dependency=assembly-reproducibility:artifacts/test-results/assembly-reproducibility/result.json
          --dependency=final-integration-close-gate:artifacts/test-results/final-integration-close-gate/result.json
          --dependency=generated-agreement:artifacts/test-results/generated-agreement/result.json
          --dependency=release-family:artifacts/test-results/release-family/result.json
          --dependency=release-gate:artifacts/test-results/release-gate/result.json
          --result=artifacts/test-results/gates/evidence-child.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-child-receipts-${{ inputs.evidence_child_sha }}
          path: artifacts/test-results/
          if-no-files-found: error
          retention-days: 30

  release-validation:
    name: exact retained release validation
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'release-validation'
    environment: qualification
    runs-on: duo-qualification
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.evidence_child_sha }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Retain exact evidence-child decision
        env:
          EVIDENCE_CHILD_SHA: ${{ inputs.evidence_child_sha }}
          PRIOR_RECEIPT: ${{ inputs.prior_receipt }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_CHILD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVIDENCE_CHILD_SHA"
          [[ "$PRIOR_RECEIPT" = /* ]] && test -f "$PRIOR_RECEIPT" && test ! -L "$PRIOR_RECEIPT"
          install -d -m 0700 artifacts/test-results/gates
          install -m 0600 "$PRIOR_RECEIPT" artifacts/test-results/gates/evidence-child.json
      - name: Qualify retained exact release bytes
        env:
          RELEASE_FAMILY: ${{ inputs.release_family }}
          RELEASE_FAMILY_SHA256: ${{ inputs.release_family_sha256 }}
          APPROVAL: ${{ inputs.approval }}
        run: make release-validation RELEASE_FAMILY="$RELEASE_FAMILY" RELEASE_FAMILY_SHA256="$RELEASE_FAMILY_SHA256" APPROVAL="$APPROVAL"
      - name: Aggregate final release-validation receipts
        run: >-
          php sandbox/catalog/fragments/engineering-platform/aggregate.php
          --profile=release-validation
          --dependency=evidence-child:artifacts/test-results/gates/evidence-child.json
          --dependency=release-validation:artifacts/test-results/release-validation/result.json
          --result=artifacts/test-results/gates/release-validation.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-receipts-${{ inputs.evidence_child_sha }}
          path: artifacts/test-results/
          if-no-files-found: error
          retention-days: 30

  nightly-live:
    name: externally approved live compatibility
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live)
    needs: resolve-shas
    environment: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Materialize protected authority outside the checkout
        env:
          APPROVAL_B64: ${{ secrets.QUALIFICATION_APPROVAL_B64 }}
          KEYRING_B64: ${{ secrets.QUALIFICATION_KEYRING_B64 }}
          PROVISIONING_B64: ${{ secrets.QUALIFICATION_PROVISIONING_B64 }}
          PROBE_B64: ${{ secrets.QUALIFICATION_PROBE_B64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/duo-harness"
          umask 077
          printf '%s' "$APPROVAL_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/approval.json"
          printf '%s' "$KEYRING_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/keyring.json"
          printf '%s' "$PROVISIONING_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/provisioning.json"
          printf '%s' "$PROBE_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/probe.json"
      - name: Live runner refuses absent or mismatched independent harness approval
        run: >-
          php sandbox/catalog/fragments/engineering-platform/runner.php
          --profile=legacy-live-compatibility
          --result=artifacts/test-results/compatibility/legacy-live/result.json
          --harness-approval="$RUNNER_TEMP/duo-harness/approval.json"
          --harness-keyring="$RUNNER_TEMP/duo-harness/keyring.json"
          --harness-provisioning="$RUNNER_TEMP/duo-harness/provisioning.json"
          --harness-probe="$RUNNER_TEMP/duo-harness/probe.json"

  nightly-conformance:
    name: conformance / ${{ matrix.subject }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live)
    needs: resolve-shas
    environment: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subject: [core, woocommerce, acf, yoast, fse, elementor, polylang, contact-form-7, ninja-forms, paid-memberships-pro]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-shas.outputs.head }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Materialize protected authority outside the checkout
        env:
          APPROVAL_B64: ${{ secrets.QUALIFICATION_APPROVAL_B64 }}
          KEYRING_B64: ${{ secrets.QUALIFICATION_KEYRING_B64 }}
          PROVISIONING_B64: ${{ secrets.QUALIFICATION_PROVISIONING_B64 }}
          PROBE_B64: ${{ secrets.QUALIFICATION_PROBE_B64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/duo-harness"
          umask 077
          printf '%s' "$APPROVAL_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/approval.json"
          printf '%s' "$KEYRING_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/keyring.json"
          printf '%s' "$PROVISIONING_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/provisioning.json"
          printf '%s' "$PROBE_B64" | base64 --decode >"$RUNNER_TEMP/duo-harness/probe.json"
      - name: Explicit destructive qualification subject
        run: >-
          make test-conformance
          SUBJECTS="conformance-${{ matrix.subject }}"
          HARNESS_APPROVAL="$RUNNER_TEMP/duo-harness/approval.json"
          HARNESS_KEYRING="$RUNNER_TEMP/duo-harness/keyring.json"
          HARNESS_PROVISIONING="$RUNNER_TEMP/duo-harness/provisioning.json"
          HARNESS_PROBE="$RUNNER_TEMP/duo-harness/probe.json"
