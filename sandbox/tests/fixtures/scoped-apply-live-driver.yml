# Ephemeral public-CLI driver services for regress_scoped_apply_live.sh.
#
# `pair.sh` is the only owner of the WordPress pair.  These one-shot CLI
# containers attach only the pair's already-created volumes/network so the
# host's public `cli/wprism` path exercises its normal DockerTransport endpoint.
# They deliberately publish no ports and own neither a database nor a
# long-lived service.  The plugin bind is the pair's own repository codebind,
# not a host-installed fixture, so provider discovery stays product-real.
# The agent, packaged adapters, and platform contract use the same sibling
# mu-plugin mount topology as pair.yml; no process-global selector participates.
services:
  source:
    image: wordpress:cli-php8.3
    user: "33:33"
    working_dir: /var/www/html
    networks: [wprism-shared]
    environment: &wp_env
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_HOST: wprism-shared-db
      WORDPRESS_DB_NAME: wp_${WPRISM_SCOPED_APPLY_PAIR}1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
    volumes:
      - source_wp:/var/www/html
      - ${WPRISM_SCOPED_APPLY_AGENT_SRC}:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ${WPRISM_SCOPED_APPLY_AGENT_SRC}/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ${WPRISM_SCOPED_APPLY_ADAPTER_PACKAGES_SRC}:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ${WPRISM_SCOPED_APPLY_PLATFORM_SRC}:/var/www/html/wp-content/mu-plugins/platform:ro
      - ${WPRISM_SCOPED_APPLY_SITE1}:/siterepo
      - ${WPRISM_SCOPED_APPLY_SITE1}/code/wp-content/plugins/${WPRISM_SCOPED_APPLY_PLUGIN_DIR}:/var/www/html/wp-content/plugins/${WPRISM_SCOPED_APPLY_PLUGIN_DIR}:ro

  target:
    image: wordpress:cli-php8.3
    user: "33:33"
    working_dir: /var/www/html
    networks: [wprism-shared]
    environment:
      <<: *wp_env
      WORDPRESS_DB_NAME: wp_${WPRISM_SCOPED_APPLY_PAIR}2
    volumes:
      - target_wp:/var/www/html
      - ${WPRISM_SCOPED_APPLY_AGENT_SRC}:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ${WPRISM_SCOPED_APPLY_AGENT_SRC}/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ${WPRISM_SCOPED_APPLY_ADAPTER_PACKAGES_SRC}:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ${WPRISM_SCOPED_APPLY_PLATFORM_SRC}:/var/www/html/wp-content/mu-plugins/platform:ro
      - ${WPRISM_SCOPED_APPLY_SITE2}:/siterepo
      - ${WPRISM_SCOPED_APPLY_SITE2}/code/wp-content/plugins/${WPRISM_SCOPED_APPLY_PLUGIN_DIR}:/var/www/html/wp-content/plugins/${WPRISM_SCOPED_APPLY_PLUGIN_DIR}:ro

networks:
  wprism-shared:
    name: wprism-shared
    external: true

volumes:
  source_wp:
    name: wprism-${WPRISM_SCOPED_APPLY_PAIR}_wp1
    external: true
  target_wp:
    name: wprism-${WPRISM_SCOPED_APPLY_PAIR}_wp2
    external: true
