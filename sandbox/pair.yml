name: duo-${DUO_PAIR}

# -----------------------------------------------------------------------------
# ONE generic, parameterized sandbox pair (task #74's sandbox redesign) —
# the single template that replaces every one of sandbox/docker-compose.yml's
# ~10 hand-duplicated pair profiles (a/b, c, e1/e2, f1/f2, conf1/conf2,
# fx1/fx2, g1/g2, r1a*, r1b*, r1c*). That file is untouched and still owns
# those historical pairs this round (see docs/sandbox.md) — this is the new
# pattern going forward, driven entirely by env vars and brought up under
# its OWN compose project per pair (`-p duo-${DUO_PAIR}`, set both via the
# `name:` above and explicitly by sandbox/bin/pair.sh) so any number of
# pairs can come and go independently, each in its own blast radius.
#
# No per-pair MariaDB here — every pair's two databases (wp_${DUO_PAIR}1 /
# wp_${DUO_PAIR}2) live on the ONE shared server sandbox/db.yml owns. That
# server must already be up (sandbox/bin/pair.sh guarantees this — it's
# also the only supported entry point for bringing a pair up at all) and
# its `duo-shared` network must already exist, since that's how these
# services reach WORDPRESS_DB_HOST (duo-shared-db, db.yml's container_name)
# across the compose-project boundary: `depends_on` can't cross projects,
# so there is deliberately no depends_on on the db here — pair.sh's own
# readiness wait (DB-level: `wp db check`, not the fake-readiness
# `wp core version` this sandbox used everywhere before this redesign)
# stands in for it.
#
# Required env vars (sandbox/bin/pair.sh sets all of these; see its usage):
#   DUO_PAIR         pair name, e.g. "sbx1", "conf" — becomes the compose
#                    project suffix and the wp_${DUO_PAIR}{1,2} database names.
#   DUO_PORT1        host port for wp1 (only actually published if
#                    pair.http.yml is layered in — see that file and
#                    pair.sh's --http/--headless).
#   DUO_PORT2        host port for wp2, same caveat.
#   DUO_AGENT_SRC    DUO-3277: host path to agent/, resolved by pair.sh
#                    against the repo's CANONICAL checkout (git's own
#                    common-dir, never wherever pair.sh's own script file
#                    happens to be invoked from) — see pair.sh's
#                    canonical_root(). Deliberately NOT a literal `../agent`
#                    here: that resolves relative to whichever checkout
#                    pair.sh was invoked from, which is fatal for a pair
#                    meant to outlive a per-issue worktree (the worktree is
#                    always removed at close-gate, silently killing the
#                    bind-mount source out from under any pair still using
#                    it — the exact hazard this env var exists to close).
#   DUO_MANIFESTS_SRC  same reasoning, for manifests/. (Not to be confused
#                    with DUO_MANIFESTS_DIR below, the CONTAINER-side path
#                    manifests/ is mounted TO — that one is fixed and
#                    unaffected by any of this.)
#   DUO_DB_HOST      which shared database server this pair's four services
#                    resolve. Defaults below to duo-shared-db — db.yml's own
#                    container_name — so a caller that sets nothing renders
#                    byte-identically to before this variable existed. It is
#                    set to duo-shared-mysql only by pair.sh's MySQL evidence
#                    lane (DUO_DB_ENGINE=mysql, see pair.sh's usage), whose
#                    server is sandbox/db.mysql.yml. The shipped platform
#                    contract now claims MySQL 8.4 beside MariaDB 11 through
#                    an engine-keyed map, with a PENDING note saying the live
#                    proof has not run yet (manifests/capabilities/
#                    platform.json), so such a pair is no longer refused on the
#                    engine axis -- selecting it is how that proof is taken.
#
# DUO_AGENT_SRC/DUO_MANIFESTS_SRC/DUO_DB_HOST reach compose two ways at once, deliberately:
# pair.sh's own subcommands get them via plain `export` (pair_compose_configure()),
# but any OTHER script that invokes `pair.sh up` as a subprocess and then
# makes its own separate `docker compose -f pair.yml ...` calls afterward
# (sandbox/conformance/run.sh, every regress_*.sh/grind_*.sh — this is most
# callers, not an edge case) never sees that export; a process boundary
# stops it cold. pair.sh also writes sandbox/.env with the same three values
# every time it runs, which compose auto-loads from the CWD with no export
# needed by the caller — every script here already `cd`s into sandbox/
# before touching compose, so this covers all of them for free. See
# pair_compose_configure()'s own comment for the live verification. DUO_DB_HOST
# rides the same channel for the same reason and with a sharper failure mode:
# a MySQL-lane pair whose subsequent subprocess compose calls re-rendered the
# duo-shared-db default would run green against the WRONG engine and silently
# claim MySQL evidence it never produced.
#
# Optional overrides, layered with additional -f flags (never edited into
# this file):
#   pair.http.yml      publish DUO_PORT1/DUO_PORT2 to wp1/wp2 (pair.sh's
#                       default; omitted entirely under --headless).
#   pair.journal.yml   turn on DUO_JOURNAL (WORDPRESS_CONFIG_EXTRA) on all
#                       four services — pair.sh's --journal.
#   pair.codebind.yml  add the spike-G-style nested bind mount of this
#                       pair's own siterepo/<name>{1,2}/code/... plugin
#                       directory — pair.sh's --codebind <plugin-dir>.
# -----------------------------------------------------------------------------

networks:
  duo-shared:
    name: duo-shared
    external: true

x-wp-env-base: &wp-env-base
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_HOST: ${DUO_DB_HOST:-duo-shared-db}
  DUO_MANIFESTS_DIR: /duo-manifests
  # The sandbox deliberately shares this one exact bind root between the host
  # fixture process and uid 33 in the WordPress/CLI containers. Git otherwise
  # rejects a host-owned /siterepo as dubious before `duo init` can reach its
  # reviewed post-Git failure seams. This is an exact container path, never a
  # wildcard safe-directory grant, and trusts nothing outside the pair bind.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: /siterepo
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');

volumes:
  wp1: {}
  wp2: {}

services:
  wp1:
    image: ${DUO_WP_IMAGE:-wordpress:7.1-php8.3-apache}
    networks: [duo-shared]
    environment:
      <<: *wp-env-base
      WORDPRESS_DB_NAME: wp_${DUO_PAIR}1
    volumes: &vol1
      - wp1:/var/www/html
      - ${DUO_AGENT_SRC}:/var/www/html/wp-content/mu-plugins/duo:ro
      - ${DUO_AGENT_SRC}/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ${DUO_MANIFESTS_SRC}:/duo-manifests:ro
      - ./siterepo/${DUO_PAIR}1:/siterepo
      # The engine-keyed db-client shim (see bin/db-client-shim.sh's header for
      # the measured TLS default-mismatch it exists for). /usr/local/bin
      # precedes /usr/bin in the image PATH, so `wp db *` and direct shell
      # calls resolve the shim; on the MariaDB lane it execs the real client
      # with untouched arguments.
      - ./bin/db-client-shim.sh:/usr/local/bin/mysql:ro
      - ./bin/db-client-shim.sh:/usr/local/bin/mysqldump:ro
      - ./bin/db-client-shim.sh:/usr/local/bin/mysqlcheck:ro
    mem_limit: 1g
    cpus: "1.0"

  cli1:
    image: ${DUO_CLI_IMAGE:-wordpress:cli-php8.3}
    user: "33:33"
    networks: [duo-shared]
    environment:
      <<: *wp-env-base
      WORDPRESS_DB_NAME: wp_${DUO_PAIR}1
    volumes: *vol1
    mem_limit: 768m
    cpus: "0.75"

  wp2:
    image: ${DUO_WP_IMAGE:-wordpress:7.1-php8.3-apache}
    networks: [duo-shared]
    environment:
      <<: *wp-env-base
      WORDPRESS_DB_NAME: wp_${DUO_PAIR}2
    volumes: &vol2
      - wp2:/var/www/html
      - ${DUO_AGENT_SRC}:/var/www/html/wp-content/mu-plugins/duo:ro
      - ${DUO_AGENT_SRC}/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ${DUO_MANIFESTS_SRC}:/duo-manifests:ro
      - ./siterepo/${DUO_PAIR}2:/siterepo
      # The engine-keyed db-client shim (see bin/db-client-shim.sh's header for
      # the measured TLS default-mismatch it exists for). /usr/local/bin
      # precedes /usr/bin in the image PATH, so `wp db *` and direct shell
      # calls resolve the shim; on the MariaDB lane it execs the real client
      # with untouched arguments.
      - ./bin/db-client-shim.sh:/usr/local/bin/mysql:ro
      - ./bin/db-client-shim.sh:/usr/local/bin/mysqldump:ro
      - ./bin/db-client-shim.sh:/usr/local/bin/mysqlcheck:ro
    mem_limit: 1g
    cpus: "1.0"

  cli2:
    image: ${DUO_CLI_IMAGE:-wordpress:cli-php8.3}
    user: "33:33"
    networks: [duo-shared]
    environment:
      <<: *wp-env-base
      WORDPRESS_DB_NAME: wp_${DUO_PAIR}2
    volumes: *vol2
    mem_limit: 768m
    cpus: "0.75"
