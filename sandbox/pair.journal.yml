# -----------------------------------------------------------------------------
# Override: turn on WPRISM_JOURNAL (sandbox/pair.yml's --journal mode). Layered
# in via `docker compose -f pair.yml -f pair.journal.yml ...`.
#
# WORDPRESS_CONFIG_EXTRA is a single scalar env var (a multi-line PHP
# snippet), so compose's map-level merge for `environment` replaces the
# whole value for this one key — this file must therefore repeat
# pair.yml's own WP_ENVIRONMENT_TYPE line verbatim alongside the new
# WPRISM_JOURNAL define, not just add a second define on its own. Same pattern
# sandbox/docker-compose.yml already used per profile (spikec/r1a/r1b/r1c
# all repeat both lines together) — this is that pattern lifted out
# to an overlay instead of copy-pasted into every profile.
# -----------------------------------------------------------------------------
services:
  wp1:
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
  cli1:
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
  wp2:
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
  cli2:
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
