  # Grind round R1-A (task #46): forms-driven business site, CF7 + Ninja
  # Forms on twentytwentyone. Own pair, own site-repo sandbox
  # (siterepo/{origin-r1a.git,r1a1,r1a2}) — never touches a/b/c/conf/e*/fx*.
  # Journal ON (WPRISM_JOURNAL), same pattern as spikec: the core loop
  # (loud gate -> pending -> classify) needs journal evidence to propose
  # classifications from.
  db-r1a1:
    <<: *db
    profiles: [r1a]
    volumes: [dbr1a1:/var/lib/mysql]

  wp-r1a1:
    image: wordpress:php8.3-apache
    profiles: [r1a]
    depends_on:
      db-r1a1: {condition: service_healthy}
    ports: ["8814:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1a1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: &vol-r1a1
      - wpr1a1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ../agent/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ../adapter-packages:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ../platform:/var/www/html/wp-content/mu-plugins/platform:ro
      - ./siterepo/r1a1:/siterepo

  cli-r1a1:
    image: wordpress:cli-php8.3
    profiles: [r1a]
    user: "33:33"
    depends_on:
      db-r1a1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1a1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: *vol-r1a1

  db-r1a2:
    <<: *db
    profiles: [r1a]
    volumes: [dbr1a2:/var/lib/mysql]

  wp-r1a2:
    image: wordpress:php8.3-apache
    profiles: [r1a]
    depends_on:
      db-r1a2: {condition: service_healthy}
    ports: ["8815:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1a2
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: &vol-r1a2
      - wpr1a2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ../agent/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ../adapter-packages:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ../platform:/var/www/html/wp-content/mu-plugins/platform:ro
      - ./siterepo/r1a2:/siterepo

  cli-r1a2:
    image: wordpress:cli-php8.3
    profiles: [r1a]
    user: "33:33"
    depends_on:
      db-r1a2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1a2
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: *vol-r1a2

  # Grind round R1-B (task #47): full WooCommerce shop — Storefront theme,
  # variable products with GLOBAL attributes (pa_* dynamic taxonomies),
  # shipping zones, tax rates, a grouped product. Own pair, own site-repo
  # sandbox (siterepo/{origin-r1b.git,r1b1,r1b2}) — never touches
  # a/b/c/conf/e*/fx*/r1a*/r1c*. Journal ON (WPRISM_JOURNAL), same pattern as
  # spikec/r1a: the core loop (loud gate -> pending -> classify) needs
  # journal evidence to propose classifications from.
  db-r1b1:
    <<: *db
    profiles: [r1b]
    volumes: [dbr1b1:/var/lib/mysql]

  wp-r1b1:
    image: wordpress:php8.3-apache
    profiles: [r1b]
    depends_on:
      db-r1b1: {condition: service_healthy}
    ports: ["8816:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1b1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: &vol-r1b1
      - wpr1b1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ../agent/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ../adapter-packages:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ../platform:/var/www/html/wp-content/mu-plugins/platform:ro
      - ./siterepo/r1b1:/siterepo

  cli-r1b1:
    image: wordpress:cli-php8.3
    profiles: [r1b]
    user: "33:33"
    depends_on:
      db-r1b1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1b1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: *vol-r1b1

  db-r1b2:
    <<: *db
    profiles: [r1b]
    volumes: [dbr1b2:/var/lib/mysql]

  wp-r1b2:
    image: wordpress:php8.3-apache
    profiles: [r1b]
    depends_on:
