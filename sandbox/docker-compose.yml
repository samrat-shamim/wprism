      - wpe1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/e1:/siterepo

  cli-e1:
    image: wordpress:cli-php8.3
    profiles: [spikee]
    user: "33:33"
    depends_on:
      db-e1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-e1
    volumes: *vol-e1

  db-e2:
    <<: *db
    profiles: [spikee]
    volumes: [dbe2:/var/lib/mysql]

  wp-e2:
    image: wordpress:php8.3-apache
    profiles: [spikee]
    depends_on:
      db-e2: {condition: service_healthy}
    ports: ["8805:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-e2
    volumes: &vol-e2
      - wpe2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/e2:/siterepo

  cli-e2:
    image: wordpress:cli-php8.3
    profiles: [spikee]
    user: "33:33"
    depends_on:
      db-e2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-e2
    volumes: *vol-e2

  db-f1:
    <<: *db
    profiles: [spikef]
    volumes: [dbf1:/var/lib/mysql]

  wp-f1:
    image: wordpress:php8.3-apache
    profiles: [spikef]
    depends_on:
      db-f1: {condition: service_healthy}
    ports: ["8808:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-f1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DUO_JOURNAL', true);
    volumes: &vol-f1
      - wpf1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/f1:/siterepo
      - ./fixtures/duo-loop-demo:/var/www/html/wp-content/plugins/duo-loop-demo:ro

  cli-f1:
    image: wordpress:cli-php8.3
    profiles: [spikef]
    user: "33:33"
    depends_on:
      db-f1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-f1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DUO_JOURNAL', true);
    volumes: *vol-f1

  db-f2:
    <<: *db
    profiles: [spikef]
    volumes: [dbf2:/var/lib/mysql]

  wp-f2:
    image: wordpress:php8.3-apache
    profiles: [spikef]
    depends_on:
      db-f2: {condition: service_healthy}
    ports: ["8809:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-f2
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DUO_JOURNAL', true);
    volumes: &vol-f2
      - wpf2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/f2:/siterepo
      - ./fixtures/duo-loop-demo:/var/www/html/wp-content/plugins/duo-loop-demo:ro

  cli-f2:
    image: wordpress:cli-php8.3
    profiles: [spikef]
    user: "33:33"
    depends_on:
      db-f2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-f2
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DUO_JOURNAL', true);
    volumes: *vol-f2

  db-conf1:
    <<: *db
    profiles: [conf]
    volumes: [dbconf1:/var/lib/mysql]

  wp-conf1:
    image: wordpress:php8.3-apache
    profiles: [conf]
    depends_on:
      db-conf1: {condition: service_healthy}
    ports: ["8806:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-conf1
    volumes: &vol-conf1
      - wpconf1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/conf1:/siterepo

  cli-conf1:
    image: wordpress:cli-php8.3
    profiles: [conf]
    user: "33:33"
    depends_on:
      db-conf1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-conf1
    volumes: *vol-conf1

  db-conf2:
    <<: *db
    profiles: [conf]
    volumes: [dbconf2:/var/lib/mysql]

  wp-conf2:
    image: wordpress:php8.3-apache
    profiles: [conf]
    depends_on:
      db-conf2: {condition: service_healthy}
    ports: ["8807:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-conf2
    volumes: &vol-conf2
      - wpconf2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/conf2:/siterepo

  cli-conf2:
    image: wordpress:cli-php8.3
    profiles: [conf]
    user: "33:33"
    depends_on:
      db-conf2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-conf2
    volumes: *vol-conf2

  db-fx1:
    <<: *db
    profiles: [fx]
    volumes: [dbfx1:/var/lib/mysql]

  wp-fx1:
    image: wordpress:php8.3-apache
    profiles: [fx]
    depends_on:
      db-fx1: {condition: service_healthy}
    ports: ["8810:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-fx1
    volumes: &vol-fx1
      - wpfx1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/fx1:/siterepo

  cli-fx1:
    image: wordpress:cli-php8.3
    profiles: [fx]
    user: "33:33"
    depends_on:
      db-fx1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-fx1
    volumes: *vol-fx1

  db-fx2:
    <<: *db
    profiles: [fx]
    volumes: [dbfx2:/var/lib/mysql]

  wp-fx2:
    image: wordpress:php8.3-apache
    profiles: [fx]
    depends_on:
      db-fx2: {condition: service_healthy}
    ports: ["8811:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-fx2
    volumes: &vol-fx2
      - wpfx2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/fx2:/siterepo

  cli-fx2:
    image: wordpress:cli-php8.3
    profiles: [fx]
    user: "33:33"
    depends_on:
      db-fx2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-fx2
    volumes: *vol-fx2

  db-g1:
    <<: *db
    profiles: [spikeg]
    volumes: [dbg1:/var/lib/mysql]

  wp-g1:
    image: wordpress:php8.3-apache
    profiles: [spikeg]
    depends_on:
      db-g1: {condition: service_healthy}
    ports: ["8812:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-g1
    volumes: &vol-g1
      - wpg1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/g1:/siterepo
      # NEW, the point of this profile: this plugin directory is NOT a static
      # sandbox fixture (contrast wp-f1/wp-f2's read-only mount of the shared
      # ../fixtures/duo-loop-demo). It's a per-env bind of THIS environment's
      # OWN site-repo checkout's code/ tree — g1 and g2 point at their own
      # clones (siterepo/g1/code/... vs siterepo/g2/code/...), so the plugin
      # bytes an environment sees are whatever that environment's own git
      # checkout currently has on disk. A `git pull` on the host is
      # immediately visible in the container with no docker rebuild/restart
      # — "the site repo IS the code source" (code-half.md proposal §5.1),
      # demonstrated at the single-directory grain instead of full-webroot
      # composer materialization (out of this spike's scope; see report).
      - ./siterepo/g1/code/wp-content/plugins/duo-loop-demo:/var/www/html/wp-content/plugins/duo-loop-demo:ro

  cli-g1:
    image: wordpress:cli-php8.3
    profiles: [spikeg]
    user: "33:33"
    depends_on:
      db-g1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-g1
    volumes: *vol-g1

  db-g2:
    <<: *db
    profiles: [spikeg]
    volumes: [dbg2:/var/lib/mysql]

  wp-g2:
    image: wordpress:php8.3-apache
    profiles: [spikeg]
    depends_on:
      db-g2: {condition: service_healthy}
    ports: ["8813:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-g2
    volumes: &vol-g2
      - wpg2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/duo:ro
      - ../agent/duo-loader.php:/var/www/html/wp-content/mu-plugins/duo-loader.php:ro
      - ../manifests:/duo-manifests:ro
      - ./siterepo/g2:/siterepo
      # per-env code source — see wp-g1's comment above (g2's own checkout).
      - ./siterepo/g2/code/wp-content/plugins/duo-loop-demo:/var/www/html/wp-content/plugins/duo-loop-demo:ro

  cli-g2:
    image: wordpress:cli-php8.3
    profiles: [spikeg]
    user: "33:33"
    depends_on:
      db-g2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-g2
    volumes: *vol-g2

volumes:
  dba: {}
  dbb: {}
  dbc: {}
  dbconf1: {}
  dbconf2: {}
  dbe1: {}
  dbe2: {}
  dbf1: {}
  dbf2: {}
  dbfx1: {}
  dbfx2: {}
  dbg1: {}
  dbg2: {}
  wpa: {}
  wpb: {}
  wpc: {}
  wpconf1: {}
  wpconf2: {}
  wpe1: {}
  wpe2: {}
  wpf1: {}
  wpf2: {}
  wpfx1: {}
  wpfx2: {}
  wpg1: {}
  wpg2: {}
