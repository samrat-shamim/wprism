    volumes: *vol-r1b2

  # Grind round R1-C (task #48): the agency stack, tested for INTERPLAY —
  # Elementor + ACF active together, plus a custom CPT plugin
  # (wprism-agency-cpt: a 'project' post type + 'project_type' taxonomy)
  # shipped through the site repo's OWN code/ tree, dogfooding spike G's
  # pattern rather than a static read-only mount of a shared ../fixtures/
  # directory the way the a/b/c/conf/e*/fx* profiles mount theirs. Each
  # env's wp-content/plugins/wprism-agency-cpt binds from THAT env's own
  # site-repo checkout's code/wp-content/plugins/wprism-agency-cpt — per spike
  # G's bootstrap-order finding (docs/code-half.md's phase-1
  # appendix): code/ must be authored on the host BEFORE wp-r1c1/wp-r1c2 are
  # ever created (docker pins a bind-mount source at container-create time),
  # and any rm+recreate of that source needs `--force-recreate` on the
  # container(s) that mount it. Own pair, own site-repo sandbox
  # (siterepo/{origin-r1c.git,r1c1,r1c2}) — never touches
  # a/b/c/conf/e*/fx*/r1a*/r1b*. Journal ON (WPRISM_JOURNAL): the core loop
  # (loud gate -> pending -> classify) needs journal evidence to propose
  # classifications from, same pattern as spikec/r1a/r1b.
  db-r1c1:
    <<: *db
    profiles: [r1c]
    volumes: [dbr1c1:/var/lib/mysql]

  wp-r1c1:
    image: wordpress:php8.3-apache
    profiles: [r1c]
    depends_on:
      db-r1c1: {condition: service_healthy}
    ports: ["8818:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1c1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: &vol-r1c1
      - wpr1c1:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ../agent/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ../adapter-packages:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ../platform:/var/www/html/wp-content/mu-plugins/platform:ro
      - ./siterepo/r1c1:/siterepo
      # NEW, the point of this profile — see the block comment above: this
      # environment's OWN site-repo checkout's code/ tree, not a shared
      # static fixture (spike G's per-env dogfooding pattern).
      - ./siterepo/r1c1/code/wp-content/plugins/wprism-agency-cpt:/var/www/html/wp-content/plugins/wprism-agency-cpt:ro

  cli-r1c1:
    image: wordpress:cli-php8.3
    profiles: [r1c]
    user: "33:33"
    depends_on:
      db-r1c1: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1c1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: *vol-r1c1

  db-r1c2:
    <<: *db
    profiles: [r1c]
    volumes: [dbr1c2:/var/lib/mysql]

  wp-r1c2:
    image: wordpress:php8.3-apache
    profiles: [r1c]
    depends_on:
      db-r1c2: {condition: service_healthy}
    ports: ["8819:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1c2
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: &vol-r1c2
      - wpr1c2:/var/www/html
      - ../agent:/var/www/html/wp-content/mu-plugins/wprism:ro
      - ../agent/wprism-loader.php:/var/www/html/wp-content/mu-plugins/wprism-loader.php:ro
      - ../adapter-packages:/var/www/html/wp-content/mu-plugins/adapter-packages:ro
      - ../platform:/var/www/html/wp-content/mu-plugins/platform:ro
      - ./siterepo/r1c2:/siterepo
      # per-env code source — see wp-r1c1's comment above (r1c2's own checkout).
      - ./siterepo/r1c2/code/wp-content/plugins/wprism-agency-cpt:/var/www/html/wp-content/plugins/wprism-agency-cpt:ro

  cli-r1c2:
    image: wordpress:cli-php8.3
    profiles: [r1c]
    user: "33:33"
    depends_on:
      db-r1c2: {condition: service_healthy}
    environment:
      <<: *wp-env
      WORDPRESS_DB_HOST: db-r1c2
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPRISM_JOURNAL', true);
    volumes: *vol-r1c2

